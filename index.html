<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>CrossFit Timer</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0a0a0a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="CF Timer" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #060608;
      --surface: #0f0f14;
      --surface2: #16161e;
      --border: #222230;
      --text-primary: #eeeef5;
      --text-secondary: #55556a;
      --text-muted: #33333f;

      --color-work:    #00e676;
      --color-rest:    #ff6d00;
      --color-neutral: #40c4ff;
      --color-finish:  #ff1744;
      --color-reps:    #e040fb;

      --phase-color: var(--color-neutral);

      --radius: 18px;
      --radius-sm: 12px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      color: var(--text-primary);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      overflow: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      background:
        radial-gradient(ellipse 100% 50% at 50% -5%, color-mix(in srgb, var(--phase-color) 10%, transparent) 0%, transparent 70%),
        var(--bg);
      transition: background 0.6s ease;
    }

    /* ── MODE NAV ── */
    #mode-nav {
      display: flex;
      gap: 8px;
      padding: 14px 14px 10px;
      overflow-x: auto;
      scrollbar-width: none;
      flex-shrink: 0;
    }
    #mode-nav::-webkit-scrollbar { display: none; }

    .mode-btn {
      flex-shrink: 0;
      padding: 8px 18px;
      border-radius: 99px;
      border: 1.5px solid transparent;
      background: var(--surface);
      color: var(--text-secondary);
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.2s ease;
      white-space: nowrap;
      touch-action: manipulation;
    }

    .mode-btn[data-mode="progressive"] { --m: #40c4ff; }
    .mode-btn[data-mode="countdown"]   { --m: #b388ff; }
    .mode-btn[data-mode="amrap"]       { --m: #ffd740; }
    .mode-btn[data-mode="emom"]        { --m: #00e676; }
    .mode-btn[data-mode="reps"]        { --m: #e040fb; }
    .mode-btn[data-mode="tabata"]      { --m: #ff6d00; }

    .mode-btn { border-color: color-mix(in srgb, var(--m, #555) 20%, var(--border)); }
    .mode-btn:hover { border-color: var(--m, var(--phase-color)); color: var(--text-primary); }
    .mode-btn.active {
      background: var(--m, var(--phase-color));
      border-color: var(--m, var(--phase-color));
      color: #000;
      box-shadow: 0 0 18px color-mix(in srgb, var(--m, var(--phase-color)) 45%, transparent);
    }

    /* ── CONFIG PANEL ── */
    #config-panel {
      padding: 8px 14px 12px;
      flex-shrink: 0;
      min-height: 68px;
      display: flex;
      align-items: center;
    }

    .config-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      width: 100%;
    }

    .config-field {
      display: flex;
      flex-direction: column;
      gap: 5px;
      flex: 1 1 90px;
      min-width: 80px;
      max-width: 180px;
    }

    .config-field label {
      font-size: 0.65rem;
      font-weight: 800;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-secondary);
    }

    .config-field input[type="number"],
    .time-input-wrap input[type="number"] {
      background: var(--surface2);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text-primary);
      font-size: 1.15rem;
      font-weight: 800;
      padding: 9px 10px;
      width: 100%;
      text-align: center;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
      -webkit-appearance: none;
      appearance: none;
    }
    .config-field input[type="number"]:focus,
    .time-input-wrap input[type="number"]:focus {
      border-color: var(--phase-color);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--phase-color) 15%, transparent);
    }
    .config-field input:disabled,
    .time-input-wrap input:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .time-input-wrap {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .time-input-wrap input { flex: 1; }
    .time-sep {
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--text-secondary);
      line-height: 1;
      margin-bottom: 2px;
    }

    .config-empty {
      font-size: 0.82rem;
      color: var(--text-muted);
      letter-spacing: 0.04em;
    }
    .config-hint {
      font-size: 0.62rem;
      color: var(--text-muted);
      letter-spacing: 0.04em;
      margin-top: 2px;
    }

    /* ── PROGRESS BAR (oculta — substituída pelo anel) ── */
    #progress-bar-wrap { display: none; }

    /* ── TIMER DISPLAY ── */
    #timer-display {
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px 16px;
    }

    #ring-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: min(72vw, 56vh, 380px);
      height: min(72vw, 56vh, 380px);
    }

    #progress-ring {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
      overflow: visible;
    }

    .ring-track {
      fill: none;
      stroke: var(--surface2);
      stroke-width: 6;
    }

    .ring-fill {
      fill: none;
      stroke: var(--phase-color);
      stroke-width: 6;
      stroke-linecap: round;
      stroke-dasharray: 540.35;
      stroke-dashoffset: 540.35;
      transition: stroke-dashoffset 0.25s linear, stroke 0.3s ease;
      filter: drop-shadow(0 0 8px var(--phase-color));
    }

    .display-inner {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    #phase-label {
      font-family: 'Bebas Neue', 'Segoe UI', sans-serif;
      font-size: clamp(1rem, 5vw, 1.4rem);
      font-weight: 400;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: var(--phase-color);
      transition: color 0.3s ease;
      min-height: 1.3em;
      text-shadow: 0 0 24px var(--phase-color);
    }

    #time-display {
      font-family: 'Bebas Neue', 'Segoe UI', sans-serif;
      font-size: clamp(4.5rem, 20vw, 8.5rem);
      font-weight: 400;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.04em;
      color: var(--phase-color);
      line-height: 1;
      transition: color 0.3s ease;
      text-shadow:
        0 0 50px var(--phase-color),
        0 0 100px color-mix(in srgb, var(--phase-color) 25%, transparent);
    }

    #time-display.pulse { animation: pulse 0.18s ease-out; }
    @keyframes pulse {
      0%   { transform: scale(1); }
      50%  { transform: scale(1.1); }
      100% { transform: scale(1); }
    }
    #time-display.finished-flash {
      animation: finishedFlash 0.5s ease infinite alternate;
    }
    @keyframes finishedFlash {
      from { opacity: 1; }
      to   { opacity: 0.2; }
    }

    #round-display {
      font-family: 'Bebas Neue', 'Segoe UI', sans-serif;
      font-size: clamp(1rem, 4vw, 1.3rem);
      font-weight: 400;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--text-secondary);
      min-height: 1.3em;
    }

    /* ── SCREEN FLASH ── */
    @keyframes screenFlash {
      0%   { opacity: 0.45; }
      100% { opacity: 0; }
    }
    #screen-flash {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 9999;
      opacity: 0;
    }

    /* ── CONTROLS ── */
    #controls {
      display: flex;
      gap: 10px;
      padding: 10px 14px 20px;
      flex-shrink: 0;
    }

    #btn-reset {
      flex: 1;
      padding: 16px;
      border-radius: var(--radius);
      border: 1.5px solid var(--border);
      background: var(--surface2);
      color: var(--text-secondary);
      font-size: 0.82rem;
      font-weight: 800;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.15s;
      touch-action: manipulation;
    }
    #btn-reset:hover:not(:disabled) {
      border-color: var(--text-secondary);
      color: var(--text-primary);
      background: var(--surface);
    }
    #btn-reset:disabled { opacity: 0.25; cursor: not-allowed; }

    #btn-start-pause {
      flex: 2.5;
      padding: 16px;
      border-radius: var(--radius);
      border: none;
      background: linear-gradient(135deg,
        color-mix(in srgb, var(--phase-color) 75%, #fff 25%),
        var(--phase-color)
      );
      color: #000;
      font-size: 1rem;
      font-weight: 900;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.3s ease, transform 0.12s, box-shadow 0.3s ease;
      touch-action: manipulation;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      box-shadow: 0 4px 28px color-mix(in srgb, var(--phase-color) 40%, transparent);
    }
    #btn-start-pause:hover { filter: brightness(1.1); }
    #btn-start-pause:active { transform: scale(0.96); }
    #btn-start-pause .sp-main { font-size: 1.5rem; font-weight: 900; line-height: 1; }
    #btn-start-pause .sp-sub  { font-size: 0.6rem; letter-spacing: 0.14em; opacity: 0.7; }

    /* ── REP MODE BUTTONS ── */
    #btn-rep-minus-ctrl,
    #btn-rep-plus-ctrl {
      flex: 1;
      padding: 16px;
      border-radius: var(--radius);
      border: 2px solid var(--border);
      background: var(--surface2);
      color: var(--text-primary);
      font-size: 2rem;
      font-weight: 300;
      cursor: pointer;
      transition: all 0.15s;
      touch-action: manipulation;
      line-height: 1;
    }
    #btn-rep-minus-ctrl[hidden],
    #btn-rep-plus-ctrl[hidden] { display: none; }
    #btn-rep-minus-ctrl:hover  { border-color: var(--color-rest); color: var(--color-rest); }
    #btn-rep-minus-ctrl:active { transform: scale(0.95); }
    #btn-rep-plus-ctrl {
      flex: 2;
      background: linear-gradient(135deg, color-mix(in srgb, var(--phase-color) 75%, #fff 25%), var(--phase-color));
      border-color: var(--phase-color);
      color: #000;
      font-weight: 700;
      box-shadow: 0 4px 20px color-mix(in srgb, var(--phase-color) 35%, transparent);
      transition: background 0.3s ease, border-color 0.3s ease, transform 0.12s;
    }
    #btn-rep-plus-ctrl:hover   { filter: brightness(1.1); }
    #btn-rep-plus-ctrl:active  { transform: scale(0.95); }

    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button {
      -webkit-appearance: none;
    }
  </style>
</head>
<body>

<nav id="mode-nav">
  <button class="mode-btn active" data-mode="progressive">For Time +</button>
  <button class="mode-btn" data-mode="countdown">For Time −</button>
  <button class="mode-btn" data-mode="amrap">AMRAP</button>
  <button class="mode-btn" data-mode="emom">EMOM</button>
  <button class="mode-btn" data-mode="reps">Reps</button>
  <button class="mode-btn" data-mode="tabata">Tabata</button>
</nav>

<div id="progress-bar-wrap"><div id="progress-bar"></div></div>

<section id="config-panel"></section>

<div id="screen-flash"></div>

<main id="timer-display">
  <div id="ring-wrapper">
    <svg id="progress-ring" viewBox="0 0 200 200" aria-hidden="true">
      <circle class="ring-track" cx="100" cy="100" r="86"/>
      <circle class="ring-fill" id="ring-fill" cx="100" cy="100" r="86"/>
    </svg>
    <div class="display-inner">
      <div id="phase-label"></div>
      <div id="time-display">00:00</div>
      <div id="round-display"></div>
    </div>
  </div>
</main>

<footer id="controls">
  <button id="btn-reset" disabled>Reset</button>
  <button id="btn-start-pause"><span class="sp-main">Start</span></button>
  <button id="btn-rep-minus-ctrl" hidden>−</button>
  <button id="btn-rep-plus-ctrl"  hidden>+</button>
</footer>

<script>
(function () {
  'use strict';

  /* ─── CONSTANTS ─────────────────────────────────────── */
  const COLOR = {
    work:    '#00e676',
    rest:    '#ff6d00',
    neutral: '#29b6f6',
    finish:  '#f44336',
    reps:    '#ce93d8',
  };

  const MODE_CONFIGS = {
    progressive: {
      label: 'For Time +',
      inputs: [
        { id: 'targetTime', label: 'Tempo alvo', type: 'time-input', default: { mm: 0, ss: 0 }, hint: '00:00 = sem limite' },
      ],
      defaults: { targetTime: 0 },
    },
    countdown: {
      label: 'For Time −',
      inputs: [
        { id: 'targetTime', label: 'Tempo alvo', type: 'time-input', default: { mm: 10, ss: 0 } },
      ],
      defaults: { targetTime: 600 },
    },
    amrap: {
      label: 'AMRAP',
      inputs: [
        { id: 'totalTime', label: 'Tempo total', type: 'time-input', default: { mm: 10, ss: 0 } },
      ],
      defaults: { totalTime: 600 },
    },
    emom: {
      label: 'EMOM',
      inputs: [
        { id: 'intervalTime', label: 'Intervalo (s)', type: 'number', default: 60, min: 5, max: 600 },
        { id: 'rounds',       label: 'Rounds',        type: 'number', default: 10, min: 1, max: 99 },
      ],
      defaults: { intervalTime: 60, rounds: 10 },
    },
    reps: {
      label: 'Reps',
      inputs: [],
      defaults: {},
    },
    tabata: {
      label: 'Tabata',
      inputs: [
        { id: 'workTime', label: 'Work (s)', type: 'number', default: 20, min: 1, max: 600 },
        { id: 'restTime', label: 'Rest (s)', type: 'number', default: 10, min: 1, max: 600 },
        { id: 'rounds',   label: 'Rounds',   type: 'number', default: 8,  min: 1, max: 99 },
      ],
      defaults: { workTime: 20, restTime: 10, rounds: 8 },
    },
    interval: {
      label: 'Interval',
      inputs: [
        { id: 'workTime', label: 'Work (s)', type: 'number', default: 40, min: 1, max: 3600 },
        { id: 'restTime', label: 'Rest (s)', type: 'number', default: 20, min: 1, max: 3600 },
        { id: 'rounds',   label: 'Rounds',   type: 'number', default: 6,  min: 1, max: 99 },
      ],
      defaults: { workTime: 40, restTime: 20, rounds: 6 },
    },
  };

  /* ─── STATE ──────────────────────────────────────────── */
  const state = {
    mode:   'progressive',
    status: 'idle',
    phase:  'work',
    config: {},

    tickOrigin:      null,
    tickAccumulated: 0,
    rafId:           null,

    elapsed:      0,
    remaining:    0,
    phaseElapsed: 0,

    currentRound: 1,
    totalRounds:  0,
    repCount: 0,

    lastBeepSecond: -1,
  };

  const audio    = { ctx: null };
  const wakeLock = { sentinel: null };

  async function requestWakeLock() {
    if (!('wakeLock' in navigator)) return;
    try {
      wakeLock.sentinel = await navigator.wakeLock.request('screen');
    } catch (_) {}
  }

  function releaseWakeLock() {
    if (wakeLock.sentinel) {
      wakeLock.sentinel.release();
      wakeLock.sentinel = null;
    }
  }

  /* ─── DOM REFS ───────────────────────────────────────── */
  const modeNav         = document.getElementById('mode-nav');
  const configPanel     = document.getElementById('config-panel');
  const phaseEl         = document.getElementById('phase-label');
  const timeEl          = document.getElementById('time-display');
  const roundEl         = document.getElementById('round-display');
  const btnReset        = document.getElementById('btn-reset');
  const btnStartPause   = document.getElementById('btn-start-pause');
  const btnRepMinusCtrl = document.getElementById('btn-rep-minus-ctrl');
  const btnRepPlusCtrl  = document.getElementById('btn-rep-plus-ctrl');
  const ringFillEl      = document.getElementById('ring-fill');
  const screenFlashEl   = document.getElementById('screen-flash');

  const RING_CIRCUMFERENCE = 2 * Math.PI * 86; // ≈ 540.35

  function updateRing(pct) {
    const offset = RING_CIRCUMFERENCE * (1 - Math.min(Math.max(pct, 0), 100) / 100);
    ringFillEl.style.strokeDashoffset = offset;
  }

  function flashScreen(color) {
    screenFlashEl.style.background = color;
    screenFlashEl.animate(
      [{ opacity: 0.45 }, { opacity: 0 }],
      { duration: 400, easing: 'ease-out' }
    );
  }

  /* ─── AUDIO ──────────────────────────────────────────── */
  function ensureAudio() {
    if (!audio.ctx) {
      audio.ctx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audio.ctx.state === 'suspended') audio.ctx.resume();
  }

  function playTone(freq, duration, vol = 0.35) {
    if (!audio.ctx) return;
    const osc  = audio.ctx.createOscillator();
    const gain = audio.ctx.createGain();
    osc.connect(gain);
    gain.connect(audio.ctx.destination);
    osc.type = 'sine';
    osc.frequency.setValueAtTime(freq, audio.ctx.currentTime);
    gain.gain.setValueAtTime(vol, audio.ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audio.ctx.currentTime + duration);
    osc.start(audio.ctx.currentTime);
    osc.stop(audio.ctx.currentTime + duration);
  }

  function beepShort()    { playTone(880, 0.15); }
  function beepCountdown(){ playTone(1100, 0.1, 0.3); }
  function beepRep()      { playTone(660, 0.06, 0.2); }
  function beepFinish() {
    beepShort();
    setTimeout(beepShort, 200);
    setTimeout(beepShort, 400);
    setTimeout(() => playTone(880, 0.35, 0.5), 650);
    setTimeout(() => playTone(660, 0.35, 0.5), 1200);
    setTimeout(() => playTone(523, 0.35, 0.5), 1750);
    setTimeout(() => playTone(440, 0.35, 0.5), 2300);
    setTimeout(() => playTone(349, 2.4, 0.4), 2900);
  }

  /* ─── TIME FORMAT ────────────────────────────────────── */
  function formatMs(ms) {
    if (ms < 0) ms = 0;
    const totalSec = Math.ceil(ms / 1000);
    const m = Math.floor(totalSec / 60);
    const s = totalSec % 60;
    if (m === 0) return String(s).padStart(2, '0');
    return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
  }

  function formatMsAlways(ms) {
    if (ms < 0) ms = 0;
    const totalSec = Math.floor(ms / 1000);
    const m = Math.floor(totalSec / 60);
    const s = totalSec % 60;
    return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
  }

  /* ─── CONFIG PANEL ───────────────────────────────────── */
  function renderConfigPanel(mode) {
    const schema = MODE_CONFIGS[mode];
    if (!schema.inputs.length) {
      const msgs = {
        reps: 'Toque no botão grande para contar repetições.',
      };
      configPanel.innerHTML = `<p class="config-empty">${msgs[mode] || ''}</p>`;
      return;
    }
    const fields = schema.inputs.map(inp => {
      if (inp.type === 'time-input') {
        const hint = inp.hint ? `<span class="config-hint">${inp.hint}</span>` : '';
        return `<div class="config-field">
          <label>${inp.label}</label>
          <div class="time-input-wrap">
            <input type="number" id="${inp.id}_mm" min="0" max="99"
              value="${inp.default.mm}" inputmode="numeric" placeholder="MM" />
            <span class="time-sep">:</span>
            <input type="number" id="${inp.id}_ss" min="0" max="59"
              value="${inp.default.ss}" inputmode="numeric" placeholder="SS" />
          </div>
          ${hint}
        </div>`;
      }
      return `<div class="config-field">
        <label>${inp.label}</label>
        <input type="number" id="${inp.id}" min="${inp.min}" max="${inp.max}"
          value="${inp.default}" inputmode="numeric" />
      </div>`;
    }).join('');
    configPanel.innerHTML = `<div class="config-grid">${fields}</div>`;
  }

  function readConfig(mode) {
    const schema = MODE_CONFIGS[mode];
    const cfg = { ...schema.defaults };
    schema.inputs.forEach(inp => {
      if (inp.type === 'time-input') {
        const mm = parseInt(document.getElementById(inp.id + '_mm')?.value) || 0;
        const ss = parseInt(document.getElementById(inp.id + '_ss')?.value) || 0;
        cfg[inp.id] = mm * 60 + ss;
      } else {
        const el = document.getElementById(inp.id);
        cfg[inp.id] = el ? (parseInt(el.value) || inp.default) : inp.default;
      }
    });
    return cfg;
  }

  function lockConfig(locked) {
    configPanel.querySelectorAll('input').forEach(el => el.disabled = locked);
  }

  /* ─── DISPLAY UPDATE ─────────────────────────────────── */
  function phaseColor() {
    if (state.mode === 'reps') return COLOR.reps;
    if (state.status === 'finished') return COLOR.finish;
    const m = state.mode;
    if (m === 'progressive' || m === 'countdown' || m === 'amrap') return COLOR.neutral;
    if (m === 'emom') return COLOR.work;
    return state.phase === 'work' ? COLOR.work : COLOR.rest;
  }

  function updateDisplay() {
    const { mode, status, phase, currentRound, totalRounds, repCount, config } = state;

    // Color
    const col = phaseColor();
    document.documentElement.style.setProperty('--phase-color', col);

    // ── Reps mode ──
    if (mode === 'reps') {
      phaseEl.textContent     = 'REPETIÇÕES';
      timeEl.textContent      = String(repCount);
      roundEl.textContent     = repCount === 1 ? '1 rep' : `${repCount} reps`;
      progressBar.style.width = '0%';
      return;
    }

    // Time
    let timeStr = '00:00';
    if (mode === 'progressive') {
      timeStr = formatMsAlways(state.elapsed);
    } else if (mode === 'countdown' || mode === 'amrap') {
      timeStr = formatMs(state.remaining);
    } else if (mode === 'emom') {
      const intvMs = (config.intervalTime || 60) * 1000;
      timeStr = formatMs(intvMs - state.phaseElapsed);
    } else {
      const phaseDur = (phase === 'work' ? config.workTime : config.restTime) * 1000;
      timeStr = formatMs(phaseDur - state.phaseElapsed);
    }
    timeEl.textContent = timeStr;

    // Phase label
    let phaseStr = '';
    if (status === 'finished') {
      phaseStr = 'DONE!';
    } else if (mode === 'progressive' || mode === 'countdown') {
      phaseStr = status === 'idle' ? '' : 'FOR TIME';
    } else if (mode === 'amrap') {
      phaseStr = status === 'idle' ? '' : 'AMRAP';
    } else if (mode === 'emom') {
      phaseStr = status === 'idle' ? '' : 'EMOM';
    } else {
      phaseStr = status === 'idle' ? '' : (phase === 'work' ? 'WORK' : 'REST');
    }
    phaseEl.textContent = phaseStr;

    // Round display
    let roundStr = '';
    if (status !== 'idle') {
      if (mode === 'emom') {
        roundStr = `Intervalo ${currentRound} / ${totalRounds}`;
      } else if (mode === 'tabata' || mode === 'interval') {
        roundStr = `Round ${currentRound} / ${totalRounds}`;
      }
    }
    roundEl.textContent = roundStr;

    // Ring progress
    let pct = 0;
    if (status === 'running' || status === 'paused') {
      if (mode === 'progressive' && config.targetTime > 0) {
        pct = Math.min(100, (state.elapsed / (config.targetTime * 1000)) * 100);
      } else if (mode === 'countdown' || mode === 'amrap') {
        const total = (config.totalTime || config.targetTime || 1) * 1000;
        pct = Math.min(100, ((total - state.remaining) / total) * 100);
      } else if (mode === 'emom') {
        const intvMs = (config.intervalTime || 60) * 1000;
        pct = Math.min(100, (state.phaseElapsed / intvMs) * 100);
      } else if (mode === 'tabata' || mode === 'interval') {
        const phaseDur = (phase === 'work' ? config.workTime : config.restTime) * 1000;
        pct = Math.min(100, (state.phaseElapsed / phaseDur) * 100);
      }
    } else if (status === 'finished') {
      pct = 100;
    }
    updateRing(pct);

  }

  function updateControls() {
    if (state.mode === 'reps') {
      btnStartPause.hidden    = true;
      btnRepMinusCtrl.hidden  = false;
      btnRepPlusCtrl.hidden   = false;
      btnReset.disabled       = state.repCount === 0;
      timeEl.classList.remove('finished-flash');
      return;
    }
    btnStartPause.hidden   = false;
    btnRepMinusCtrl.hidden = true;
    btnRepPlusCtrl.hidden  = true;

    const labels = {
      idle:     '<span class="sp-main">Start</span>',
      running:  '<span class="sp-main">Pausar</span>',
      paused:   '<span class="sp-main">Retomar</span>',
      finished: '<span class="sp-main">Reiniciar</span>',
    };
    btnStartPause.innerHTML = labels[state.status] || '<span class="sp-main">Start</span>';
    btnReset.disabled = state.status === 'idle';

    if (state.status === 'finished') {
      timeEl.classList.add('finished-flash');
    } else {
      timeEl.classList.remove('finished-flash');
    }
  }

  /* ─── TIMER CORE ─────────────────────────────────────── */
  function tick() {
    if (state.status !== 'running') return;

    const wall = state.tickAccumulated + (Date.now() - state.tickOrigin);

    if (state.mode === 'progressive') {
      state.elapsed = wall;
      const targetMs = (state.config.targetTime || 0) * 1000;
      if (targetMs > 0) {
        const secLeft = Math.ceil((targetMs - wall) / 1000);
        if (secLeft <= 3 && secLeft >= 1 && secLeft !== state.lastBeepSecond) {
          state.lastBeepSecond = secLeft;
          beepCountdown();
        }
        if (wall >= targetMs) {
          state.elapsed = targetMs;
          finishTimer();
          updateDisplay();
          updateControls();
          return;
        }
      }
    } else if (state.mode === 'countdown' || state.mode === 'amrap') {
      const total = (state.config.totalTime || state.config.targetTime || 0) * 1000;
      state.remaining = Math.max(0, total - wall);

      const secLeft = Math.ceil(state.remaining / 1000);
      if (secLeft <= 3 && secLeft >= 1 && secLeft !== state.lastBeepSecond) {
        state.lastBeepSecond = secLeft;
        beepCountdown();
      }

      if (state.remaining <= 0) {
        state.remaining = 0;
        finishTimer();
        updateDisplay();
        updateControls();
        return;
      }
    } else if (state.mode === 'emom') {
      state.phaseElapsed = wall % ((state.config.intervalTime || 60) * 1000);
      const newRound = Math.floor(wall / ((state.config.intervalTime || 60) * 1000)) + 1;

      if (newRound !== state.currentRound && newRound <= state.totalRounds) {
        state.currentRound = newRound;
        state.lastBeepSecond = -1;
        beepShort();
      } else if (newRound > state.totalRounds) {
        finishTimer();
        updateDisplay();
        updateControls();
        return;
      }

      const intvMs = (state.config.intervalTime || 60) * 1000;
      const secLeft = Math.ceil((intvMs - state.phaseElapsed) / 1000);
      if (secLeft <= 3 && secLeft >= 1 && secLeft !== state.lastBeepSecond) {
        state.lastBeepSecond = secLeft;
        beepCountdown();
      }
    } else {
      // tabata / interval
      const phaseDur = state.phase === 'work'
        ? state.config.workTime * 1000
        : state.config.restTime * 1000;
      state.phaseElapsed = wall - state.phaseOrigin;

      const secLeft = Math.ceil((phaseDur - state.phaseElapsed) / 1000);
      if (secLeft <= 3 && secLeft >= 1 && secLeft !== state.lastBeepSecond) {
        state.lastBeepSecond = secLeft;
        beepCountdown();
      }

      if (state.phaseElapsed >= phaseDur) {
        advancePhase(phaseDur);
        if (state.status === 'finished') {
          updateDisplay();
          updateControls();
          return;
        }
      }
    }

    updateDisplay();
    state.rafId = requestAnimationFrame(tick);
  }

  function advancePhase(phaseDur) {
    const overflow = state.phaseElapsed - phaseDur;

    if (state.phase === 'work') {
      state.phase = 'rest';
      beepShort();
      flashScreen(COLOR.rest);
    } else {
      state.currentRound++;
      if (state.currentRound > state.totalRounds) {
        finishTimer();
        return;
      }
      state.phase = 'work';
      beepShort();
      flashScreen(COLOR.work);
    }
    state.phaseOrigin = (Date.now() - state.tickOrigin + state.tickAccumulated) - overflow;
    state.phaseElapsed = overflow;
    state.lastBeepSecond = -1;
  }

  function finishTimer() {
    cancelAnimationFrame(state.rafId);
    state.rafId  = null;
    state.status = 'finished';
    beepFinish();
    timeEl.classList.remove('pulse');
    releaseWakeLock();
  }

  function startTimer() {
    if (state.status === 'finished') resetTimer();

    const cfg = readConfig(state.mode);
    state.config = cfg;

    if (state.mode === 'countdown' && (!cfg.targetTime || cfg.targetTime < 1)) return;
    if (state.mode === 'amrap'     && (!cfg.totalTime  || cfg.totalTime  < 1)) return;

    state.status       = 'running';
    state.phase        = 'work';
    state.elapsed      = 0;
    state.phaseElapsed = 0;
    state.lastBeepSecond = -1;

    if (state.mode === 'countdown') {
      state.remaining = cfg.targetTime * 1000;
    } else if (state.mode === 'amrap') {
      state.remaining = cfg.totalTime * 1000;
    } else if (state.mode === 'emom') {
      state.totalRounds  = cfg.rounds;
      state.currentRound = 1;
      state.phaseElapsed = 0;
      beepShort();
    } else if (state.mode === 'tabata' || state.mode === 'interval') {
      state.totalRounds  = cfg.rounds;
      state.currentRound = 1;
      state.phaseOrigin  = 0;
      beepShort();
    }

    state.tickOrigin      = Date.now();
    state.tickAccumulated = 0;

    lockConfig(true);
    requestWakeLock();
    state.rafId = requestAnimationFrame(tick);
  }

  function pauseTimer() {
    state.tickAccumulated += Date.now() - state.tickOrigin;
    cancelAnimationFrame(state.rafId);
    state.rafId  = null;
    state.status = 'paused';
    releaseWakeLock();
  }

  function resumeTimer() {
    state.tickOrigin = Date.now();
    state.status     = 'running';
    requestWakeLock();
    state.rafId      = requestAnimationFrame(tick);
  }

  function resetTimer() {
    cancelAnimationFrame(state.rafId);
    state.rafId           = null;
    state.status          = 'idle';
    state.phase           = 'work';
    state.elapsed         = 0;
    state.remaining       = 0;
    state.phaseElapsed    = 0;
    state.currentRound    = 1;
    state.totalRounds     = 0;
    state.repCount        = 0;
    state.tickAccumulated = 0;
    state.tickOrigin      = null;
    state.lastBeepSecond  = -1;
    lockConfig(false);
    timeEl.classList.remove('finished-flash');
    releaseWakeLock();
  }

  /* ─── MODE SWITCH ────────────────────────────────────── */
  function switchMode(newMode) {
    resetTimer();
    state.mode = newMode;
    document.querySelectorAll('.mode-btn').forEach(b => {
      b.classList.toggle('active', b.dataset.mode === newMode);
    });
    renderConfigPanel(newMode);
    updateDisplay();
    updateControls();
  }

  /* ─── PULSE ANIMATION ────────────────────────────────── */
  function triggerPulse() {
    timeEl.classList.remove('pulse');
    void timeEl.offsetWidth;
    timeEl.classList.add('pulse');
  }

  /* ─── EVENT LISTENERS ────────────────────────────────── */
  modeNav.addEventListener('click', e => {
    const btn = e.target.closest('.mode-btn');
    if (btn) switchMode(btn.dataset.mode);
  });

  btnRepPlusCtrl.addEventListener('click', () => {
    ensureAudio();
    state.repCount++;
    beepRep();
    triggerPulse();
    updateDisplay();
    updateControls();
  });

  btnRepMinusCtrl.addEventListener('click', () => {
    if (state.repCount > 0) {
      state.repCount--;
      updateDisplay();
      updateControls();
    }
  });

  btnStartPause.addEventListener('click', () => {
    ensureAudio();

    // Timer modes
    if (state.status === 'idle' || state.status === 'finished') {
      startTimer();
    } else if (state.status === 'running') {
      pauseTimer();
    } else if (state.status === 'paused') {
      resumeTimer();
    }
    updateDisplay();
    updateControls();
  });

  btnReset.addEventListener('click', () => {
    resetTimer();
    updateDisplay();
    updateControls();
  });

  // Visibility change — re-acquire wake lock if timer was running
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && state.status === 'running') {
      state.tickOrigin = Date.now();
      requestWakeLock();
    }
  });


  /* ─── INIT ───────────────────────────────────────────── */
  switchMode('progressive');
})();
</script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js');
    });
  }
</script>
</body>
</html>
